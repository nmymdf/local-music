name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build log when the build fails
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          rm -rf /tmp/logrepo
          mkdir -p /tmp/logrepo
          cd /tmp/logrepo
          git init -b buildlog
          git remote add origin "$URL"
          tail -n 300 "$GITHUB_WORKSPACE/build.log" > build-tail.log || true
          grep -nE "^e: |What went wrong|FAILURE|error:" -A4 "$GITHUB_WORKSPACE/build.log" | head -250 > errors.txt || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "build log ${GITHUB_SHA::7}" || true
          git push --force origin buildlog

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-music-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to the apk branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          rm -rf /tmp/apkrepo
          if git clone --branch apk --depth 1 "$URL" /tmp/apkrepo 2>/dev/null; then
            echo "apk branch exists"
          else
            mkdir -p /tmp/apkrepo
            cd /tmp/apkrepo
            git init -b apk
            git remote add origin "$URL"
            cd - > /dev/null
          fi
          cp app/build/outputs/apk/release/app-release.apk "/tmp/apkrepo/local-music-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "/tmp/apkrepo/local-music-latest.apk"
          cd /tmp/apkrepo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "APK v${VERSION} (${GITHUB_SHA::7})" || echo "nothing to commit"
          git push origin apk
